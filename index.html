<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Security Warning</title>
    <style>
        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 20px;
            margin: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        .container {
            max-width: 400px;
            width: 100%;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid #ff0033;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(255, 0, 51, 0.5);
        }
        h2 {
            color: #ff0033;
            font-size: 20px;
            margin-bottom: 15px;
        }
        p {
            font-size: 14px;
            margin: 8px 0;
            text-align: left;
        }
        .warning {
            color: #ff0033;
            font-weight: bold;
            font-size: 16px;
            margin-top: 20px;
            animation: blink 0.8s infinite;
        }
        @keyframes blink {
            0% { opacity: 1; }
            50% { opacity: 0.2; }
            100% { opacity: 1; }
        }
        video {
            width: 100%;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.5);
        }
    </style>
</head>
<body>

    <div class="container" id="box">
        <h2>[!] SYSTEM SECURITY ALERT</h2>
        <p id="line1">&gt; Connecting to target device...</p>
        <p id="line2" style="display:none;">&gt; Root Access: <span style="color:red">GRANTED</span></p>
        <p id="line3" style="display:none;">&gt; Extracting Gallery Photos... [98% Done]</p>
        <p id="line4" style="display:none;">&gt; Extracting Contacts & WhatsApp... [Done]</p>
        <p id="line5" style="display:none;">&gt; Uploading data to remote server...</p>
        <p class="warning" id="line6" style="display:none;">🔴 تم الاختراق بنجاح!</p>
        
        <!-- ضفنا muted عشان المتصفح ما يمنعش الفيديو من الشغل -->
        <video id="prankVideo" playsinline controls>
            <source src="laugh.mp4" type="video/mp4">
            متصفحك لا يدعم عرض الفيديو.
        </video>
    </div>

    <script>
        setTimeout(() => { document.getElementById('line2').style.display = 'block'; }, 1500);
        setTimeout(() => { document.getElementById('line3').style.display = 'block'; }, 3000);
        setTimeout(() => { document.getElementById('line4').style.display = 'block'; }, 4500);
        setTimeout(() => { document.getElementById('line5').style.display = 'block'; }, 6000);
        setTimeout(() => { document.getElementById('line6').style.display = 'block'; }, 7500);

        setTimeout(() => {
            // إخفاء كتابات الاختراق بالكامل
            document.getElementById('line1').style.display = 'none';
            document.getElementById('line2').style.display = 'none';
            document.getElementById('line3').style.display = 'none';
            document.getElementById('line4').style.display = 'none';
            document.getElementById('line5').style.display = 'none';
            document.getElementById('line6').style.display = 'none';
            
            // إظهار الفيديو وتشغيله إجباري
            let vid = document.getElementById('prankVideo');
            vid.style.display = 'block';
            vid.play().catch(error => {
                console.log("Autoplay blocked, showing controls for manual play");
            });
        }, 10500);
    </script>

</body>
</html>
